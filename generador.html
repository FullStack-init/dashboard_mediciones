<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Generador de JSON - Aeroponía (4 archivos)</title>
    <style>
        :root {
            --bg: #e0e5ec; --shadow-dark: #a3b1c6; --shadow-light: #ffffff;
            --text: #2d3a4a; --text-muted: #6c7a8a; --radius: 16px;
        }
        body {
            background: var(--bg); color: var(--text);
            font-family: 'Inter', sans-serif; padding: 2rem;
            display: flex; justify-content: center; align-items: center; min-height: 100vh;
        }
        .container {
            background: var(--bg); border-radius: var(--radius);
            box-shadow: 8px 8px 16px var(--shadow-dark), -8px -8px 16px var(--shadow-light);
            padding: 2rem; text-align: center; max-width: 600px; width: 100%;
        }
        h1 { font-size: 1.5rem; margin-bottom: 0.5rem; }
        p { color: var(--text-muted); font-size: 0.85rem; margin-bottom: 1.5rem; }
        .btn {
            background: var(--bg); border: none; padding: 0.8rem 1.5rem; margin: 0.5rem;
            border-radius: 50px; box-shadow: 6px 6px 12px var(--shadow-dark), -6px -6px 12px var(--shadow-light);
            cursor: pointer; font-size: 0.9rem; font-weight: 500; color: var(--text);
            transition: all 0.2s; display: inline-block; width: calc(100% - 1rem); max-width: 300px;
        }
        .btn:hover { box-shadow: inset 4px 4px 8px var(--shadow-dark), inset -4px -4px 8px var(--shadow-light); color: #4f8df9; }
        .btn-group { display: flex; flex-direction: column; align-items: center; }
    </style>
</head>
<body>
    <div class="container">
        <h1>📦 Generador de JSON (4 archivos)</h1>
        <p>Datos horarios · 30 días · Referencia exterior + controladas</p>
        <div class="btn-group">
            <button class="btn" onclick="descargar('temperatura.json', generarTemperatura())">🌡️ Temperatura</button>
            <button class="btn" onclick="descargar('humedad.json', generarHumedad())">💧 Humedad</button>
            <button class="btn" onclick="descargar('presion.json', generarPresion())">🌀 Presión</button>
            <button class="btn" onclick="descargar('iluminacion_conductividad.json', generarIluminacionCE())">💡 Luz, pH y CE</button>
        </div>
        <p style="margin-top:1rem; font-size:0.8rem;">Descarga los 4 archivos y colócalos junto al dashboard.</p>
    </div>

    <script>
        const DIAS = 30, MUESTRAS = 24, TOTAL = DIAS * MUESTRAS;
        const inicio = new Date('2025-01-01T00:00:00');

        function rand(min, max) { return min + Math.random() * (max - min); }
        function cicloDiurno(hora) { if (hora < 6 || hora > 18) return 0.15; return Math.max(0.15, Math.sin((hora-6)/12*Math.PI)); }
        function fechas() {
            let arr = [];
            for (let i=0; i<TOTAL; i++) { let f = new Date(inicio); f.setHours(inicio.getHours()+i); arr.push(f); }
            return arr;
        }

        function generarTemperatura() {
            const fechasArr = fechas();
            let datos = fechasArr.map(f => {
                let hora = f.getHours();
                let temp_ext = +(5 + (14-5)*cicloDiurno(hora) + rand(-1.5, 1.5)).toFixed(1);
                let temp_raiz = +(20 + rand(-0.5, 0.5)).toFixed(1);
                let temp_hojas = +(20 + rand(-1.0, 1.0)).toFixed(1);
                return { fecha: f.toISOString(), temp_ext, temp_raiz, temp_hojas };
            });
            return { descripcion:"Temperatura exterior (referencia), raíz y hojas", unidad:"°C", datos };
        }

        function generarHumedad() {
            const fechasArr = fechas();
            let datos = fechasArr.map(f => {
                let hora = f.getHours();
                let hum_ext = +(50 + (90-50)*(1-cicloDiurno(hora)) + rand(-5, 5)).toFixed(1);
                let hum_raiz = +(95 + rand(-2, 2)).toFixed(1);
                let hum_hojas = +(62 + rand(-5, 5)).toFixed(1);
                return { fecha: f.toISOString(), hum_ext, hum_raiz, hum_hojas };
            });
            return { descripcion:"Humedad exterior (referencia), raíz y hojas", unidad:"%", datos };
        }

        function generarPresion() {
            const fechasArr = fechas();
            let datos = fechasArr.map(f => {
                let pres_ext = +(1010 + rand(-8, 8)).toFixed(1);
                let pres_raiz = +(pres_ext + rand(-0.3, 0.3)).toFixed(1);
                let pres_hojas = +(pres_ext + rand(-0.3, 0.3)).toFixed(1);
                return { fecha: f.toISOString(), pres_ext, pres_raiz, pres_hojas };
            });
            return { descripcion:"Presión exterior (referencia), raíz y hojas", unidad:"hPa", datos };
        }

        function generarIluminacionCE() {
            const fechasArr = fechas();
            let datos = fechasArr.map((f, i) => {
                let hora = f.getHours();
                let dia = Math.floor(i/24)+1;
                let encendido = hora >= 6 && hora < 22;
                let factorRojo = dia <= 10 ? 1 : Math.max(0.7, 1-(dia-10)*0.03);
                let factorAzul = dia <= 10 ? 1 : Math.min(1.3, 1+(dia-10)*0.03);
                let luz_roja = encendido ? Math.round(150*factorRojo + rand(-5,5)) : 0;
                let luz_azul = encendido ? Math.round(80*factorAzul + rand(-5,5)) : 0;
                let ph = +(5.8 + rand(-0.15, 0.15)).toFixed(2);
                let ce = +(1.8 + rand(-0.1, 0.1)).toFixed(2);
                return { fecha: f.toISOString(), luz_roja, luz_azul, ph, ce };
            });
            return { descripcion:"Iluminación (hojas), pH y CE (agua)", unidades:{luz_roja:"µmol/m²/s", luz_azul:"µmol/m²/s", ph:"", ce:"mS/cm"}, datos };
        }

        function descargar(nombre, objeto) {
            const blob = new Blob([JSON.stringify(objeto, null, 2)], {type:'application/json'});
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a'); a.href=url; a.download=nombre;
            document.body.appendChild(a); a.click(); document.body.removeChild(a); URL.revokeObjectURL(url);
        }
    </script>
</body>
</html>
