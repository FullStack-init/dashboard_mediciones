<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard Aeroponía - Lectura de JSON</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
    <style>
        :root {
            --bg: #e0e5ec;
            --shadow-dark: #a3b1c6;
            --shadow-light: #ffffff;
            --text: #2d3a4a;
            --text-muted: #6c7a8a;
            --accent: #4f8df9;
            --success: #4caf7d;
            --warning: #f5b042;
            --danger: #e85d5d;
            --radius: 16px;
            --radius-sm: 10px;
            --transition: 0.25s ease;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: var(--bg);
            color: var(--text);
            font-family: 'Inter', 'Segoe UI', sans-serif;
            padding: 1rem;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }
        header {
            text-align: center;
            margin-bottom: 1rem;
        }
        header h1 {
            font-size: 1.6rem;
            font-weight: 600;
        }
        header p {
            color: var(--text-muted);
            font-size: 0.8rem;
        }

        /* Cuadrícula de tarjetas */
        .grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1rem;
            margin-bottom: 1rem;
        }
        @media (max-width: 600px) {
            .grid {
                grid-template-columns: 1fr;
            }
        }

        .card {
            background: var(--bg);
            border-radius: var(--radius);
            box-shadow: 8px 8px 16px var(--shadow-dark), -8px -8px 16px var(--shadow-light);
            padding: 1rem;
            transition: box-shadow var(--transition);
        }
        .card h2 {
            font-size: 1rem;
            margin-bottom: 0.5rem;
            font-weight: 500;
            color: var(--text);
            text-align: center;
        }
        .chart-container {
            position: relative;
            height: 250px;
            width: 100%;
        }
        footer {
            text-align: center;
            margin-top: auto;
            padding: 1rem 0 0;
            font-size: 0.7rem;
            color: var(--text-muted);
        }
    </style>
</head>
<body>
    <header>
        <h1>🌿 Dashboard Aeroponía Automatizada</h1>
        <p>Datos horarios · 30 días · Albahaca en Asturias</p>
    </header>

    <div class="grid">
        <!-- Tarjeta 1: Temperatura -->
        <div class="card">
            <h2>🌡️ Temperatura (interior/exterior)</h2>
            <div class="chart-container"><canvas id="chart-temperatura"></canvas></div>
        </div>
        <!-- Tarjeta 2: Humedad -->
        <div class="card">
            <h2>💧 Humedad (interior/exterior)</h2>
            <div class="chart-container"><canvas id="chart-humedad"></canvas></div>
        </div>
        <!-- Tarjeta 3: Presión -->
        <div class="card">
            <h2>🌀 Presión Atmosférica (int/ext)</h2>
            <div class="chart-container"><canvas id="chart-presion"></canvas></div>
        </div>
        <!-- Tarjeta 4: Iluminación y CE -->
        <div class="card">
            <h2>💡 Iluminación y Conductividad</h2>
            <div class="chart-container"><canvas id="chart-iluminacion-ce"></canvas></div>
        </div>
    </div>

    <footer>
        Dashboard simplificado · Datos desde archivos JSON
    </footer>

    <script>
        // Función para cargar JSON desde archivo
        async function cargarJSON(url) {
            const resp = await fetch(url);
            if (!resp.ok) throw new Error(`No se pudo cargar ${url}`);
            return await resp.json();
        }

        // Función para extraer etiquetas de fecha (día/mes hora:min)
        function obtenerEtiquetas(datos) {
            return datos.map(d => {
                const f = new Date(d.fecha);
                return `${f.getDate()}/${f.getMonth()+1} ${f.getHours()}:00`;
            });
        }

        // Función para crear gráfico de dos líneas (interior vs exterior)
        function crearGraficoDoble(canvasId, labels, dataInt, dataExt, colorInt, labelInt, colorExt, labelExt) {
            const ctx = document.getElementById(canvasId).getContext('2d');
            new Chart(ctx, {
                type: 'line',
                data: {
                    labels,
                    datasets: [
                        {
                            label: labelInt,
                            data: dataInt,
                            borderColor: colorInt,
                            backgroundColor: colorInt + '22',
                            fill: true,
                            tension: 0.3,
                            pointRadius: 0,
                            borderWidth: 2
                        },
                        {
                            label: labelExt,
                            data: dataExt,
                            borderColor: colorExt,
                            backgroundColor: 'transparent',
                            tension: 0.3,
                            pointRadius: 0,
                            borderWidth: 2
                        }
                    ]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: {
                        legend: { display: true, labels: { color: '#2d3a4a', boxWidth: 12, font: { size: 10 } } },
                        tooltip: { mode: 'index', intersect: false }
                    },
                    scales: {
                        x: { ticks: { color: '#6c7a8a', maxTicksLimit: 10, font: { size: 9 } }, grid: { color: '#c9d1db' } },
                        y: { ticks: { color: '#6c7a8a', font: { size: 9 } }, grid: { color: '#c9d1db' } }
                    }
                }
            });
        }

        // Función para gráfico de iluminación + CE (doble eje)
        function crearGraficoIluminacionCE(canvasId, labels, luzRoja, luzAzul, ce) {
            const ctx = document.getElementById(canvasId).getContext('2d');
            new Chart(ctx, {
                type: 'line',
                data: {
                    labels,
                    datasets: [
                        {
                            label: 'Luz Roja',
                            data: luzRoja,
                            borderColor: '#e85d5d',
                            backgroundColor: '#e85d5d22',
                            fill: true,
                            tension: 0.3,
                            pointRadius: 0,
                            borderWidth: 2,
                            yAxisID: 'y'
                        },
                        {
                            label: 'Luz Azul',
                            data: luzAzul,
                            borderColor: '#4f8df9',
                            backgroundColor: '#4f8df922',
                            fill: true,
                            tension: 0.3,
                            pointRadius: 0,
                            borderWidth: 2,
                            yAxisID: 'y'
                        },
                        {
                            label: 'CE (mS/cm)',
                            data: ce,
                            borderColor: '#f5b042',
                            backgroundColor: 'transparent',
                            tension: 0.3,
                            pointRadius: 0,
                            borderWidth: 2,
                            yAxisID: 'y1'
                        }
                    ]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: {
                        legend: { display: true, labels: { color: '#2d3a4a', boxWidth: 12, font: { size: 10 } } },
                        tooltip: { mode: 'index', intersect: false }
                    },
                    scales: {
                        x: { ticks: { color: '#6c7a8a', maxTicksLimit: 10, font: { size: 9 } }, grid: { color: '#c9d1db' } },
                        y: {
                            type: 'linear',
                            position: 'left',
                            ticks: { color: '#6c7a8a', font: { size: 9 } },
                            title: { display: true, text: 'µmol/m²/s', color: '#6c7a8a' }
                        },
                        y1: {
                            type: 'linear',
                            position: 'right',
                            ticks: { color: '#6c7a8a', font: { size: 9 } },
                            grid: { drawOnChartArea: false },
                            title: { display: true, text: 'mS/cm', color: '#6c7a8a' }
                        }
                    }
                }
            });
        }

        // ==================== INICIALIZACIÓN ====================
        async function init() {
            try {
                // Cargar los 4 JSON
                const [tempData, humData, presData, ilumData] = await Promise.all([
                    cargarJSON('temperatura.json'),
                    cargarJSON('humedad.json'),
                    cargarJSON('presion.json'),
                    cargarJSON('iluminacion_conductividad.json')
                ]);

                // Etiquetas comunes (asumimos misma fecha)
                const labels = obtenerEtiquetas(tempData.datos);

                // 1. Temperatura
                const tempInt = tempData.datos.map(d => d.temp_int);
                const tempExt = tempData.datos.map(d => d.temp_ext);
                crearGraficoDoble('chart-temperatura', labels, tempInt, tempExt, '#4f8df9', 'Interior (°C)', '#94a3b8', 'Exterior (°C)');

                // 2. Humedad
                const humInt = humData.datos.map(d => d.hum_int);
                const humExt = humData.datos.map(d => d.hum_ext);
                crearGraficoDoble('chart-humedad', labels, humInt, humExt, '#4caf7d', 'Interior (%)', '#94a3b8', 'Exterior (%)');

                // 3. Presión
                const presInt = presData.datos.map(d => d.pres_int);
                const presExt = presData.datos.map(d => d.pres_ext);
                crearGraficoDoble('chart-presion', labels, presInt, presExt, '#9aa5b1', 'Interior (hPa)', '#94a3b8', 'Exterior (hPa)');

                // 4. Iluminación y CE
                const luzRoja = ilumData.datos.map(d => d.luz_roja);
                const luzAzul = ilumData.datos.map(d => d.luz_azul);
                const ce = ilumData.datos.map(d => d.ce);
                crearGraficoIluminacionCE('chart-iluminacion-ce', labels, luzRoja, luzAzul, ce);

            } catch (error) {
                console.error('Error cargando datos:', error);
                document.body.innerHTML += `<p style="color:red; text-align:center;">No se pudieron cargar los archivos JSON. Asegúrate de que estén en el mismo directorio.</p>`;
            }
        }

        window.addEventListener('DOMContentLoaded', init);
    </script>
</body>
</html>
